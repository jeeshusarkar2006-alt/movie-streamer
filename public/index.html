<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Netflix</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #e50914;
            margin-bottom: 20px;
        }
        .player-container {
            width: 100%;
            max-width: 800px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        video {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <h1>My Personal Netflix</h1>
    <p>Select a movie to watch from anywhere</p>

    <div class="player-container">
        <video controls>
            <source src="https://lh3.googleusercontent.com/d/1wTGT8vxI04WRujN6vjqdzUNvnSKFsnXY" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

</body>
</html>
