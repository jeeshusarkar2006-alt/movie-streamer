<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student of the Year: After Dark - Streaming</title>
    <style>
        body {
            background-color: #141414;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        h1 {
            color: #e50914;
            margin-bottom: 5px;
        }
        p {
            color: #aaa;
            margin-bottom: 20px;
        }
        .player-container {
            max-width: 850px;
            margin: 0 auto;
        }
        video {
            width: 100%;
            max-height: 480px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            background: #000;
        }
        .episode-buttons {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn {
            background-color: #333;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
        }
        .btn:hover, .btn.active {
            background-color: #e50914;
        }
    </style>
</head>
<body>

    <h1>Student of the Year: After Dark</h1>
    <p>Select an episode to start streaming</p>

    <div class="player-container">
        <!-- Video Player -->
        <video id="videoPlayer" controls autoplay>
            <source id="videoSource" src="https://www.dropbox.com/scl/fi/2uxu8gbauis7smbf2ljpc/Student.of.the.Year.After.Dark.S01E01.1080p.JHS.WEB-DL.Hindi.DDP5.1.H.264-1vegamovies.tw.mkv.mp4?rlkey=t517oqfj9negle7ejh8ubugx7&st=lkyv90rh&raw=1" type="video/mp4">
            Your browser does not support the video tag.
        </video>

        <!-- Episode Selection Buttons -->
        <div class="episode-buttons">
            <button class="btn active" onclick="changeEpisode('https://www.dropbox.com/scl/fi/2uxu8gbauis7smbf2ljpc/Student.of.the.Year.After.Dark.S01E01.1080p.JHS.WEB-DL.Hindi.DDP5.1.H.264-1vegamovies.tw.mkv.mp4?rlkey=t517oqfj9negle7ejh8ubugx7&st=lkyv90rh&raw=1', this)">Episode 1</button>
            
            <button class="btn" onclick="changeEpisode('https://www.dropbox.com/scl/fi/nmyal1b3icvy0v0cdwqq6/Student.of.the.Year.After.Dark.S01E02.1080p.JHS.WEB-DL.Hindi.DDP5.1.H.264-1vegamovies.tw.mkv.mp4?rlkey=ghn120z9eivibc622zm8r9o2f&st=64ew598w&raw=1', this)">Episode 2</button>
            
            <button class="btn" onclick="changeEpisode('https://www.dropbox.com/scl/fi/yvpqlugw2t0demg3rufxd/Student.of.the.Year.After.Dark.S01E03.1080p.JHS.WEB-DL.Hindi.DDP5.1.H.264-1vegamovies.tw.mkv.mp4?rlkey=y3qczz4q76w5vlhaav03ftjay&st=hbium9d2&raw=1', this)">Episode 3</button>
            
            <button class="btn" onclick="changeEpisode('https://www.dropbox.com/scl/fi/5h69j36d978oou3rj0sso/Student.of.the.Year.After.Dark.S01E04.1080p.JHS.WEB-DL.Hindi.DDP5.1.H.264-1vegamovies.tw.mkv.mp4?rlkey=3z83ezl115pnnb2u6ewwedunn&st=itedu6yl&raw=1', this)">Episode 4</button>
            
            <button class="btn" onclick="changeEpisode('https://www.dropbox.com/scl/fi/fkmnnrtj0pomhw7qbcutu/Student.of.the.Year.After.Dark.S01E05.1080p.JHS.WEB-DL.Hindi.DDP5.1.H.264-1vegamovies.tw.mkv.mp4?rlkey=wwklht5zomyjxcqkevmg2vwdb&st=j3fn6dqw&raw=1', this)">Episode 5</button>
        </div>
    </div>

    <script>
        function changeEpisode(videoUrl, buttonElement) {
            var player = document.getElementById('videoPlayer');
            var source = document.getElementById('videoSource');
            
            // Set new video source
            source.src = videoUrl;
            player.load();
            player.play();

            // Update active button style
            var buttons = document.querySelectorAll('.btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            buttonElement.classList.add('active');
        }
    </script>

</body>
</html>
